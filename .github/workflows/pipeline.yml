name: competitive-radar monitoring

# Non-AI monitoring only.
#   sync competitors -> collect -> snapshot -> deterministic diff
#   -> pending intelligence queue -> weekly pulse -> static JSON
# NO model API key is referenced anywhere in this workflow. A missing
# GOOGLE_API_KEY / GROQ_API_KEY / OPENAI_API_KEY can never fail this job.
#
# AI analysis is deliberately NOT automated here: it is human-triggered via
# the external Antigravity agent (see docs/ANTIGRAVITY_WORKFLOW.md).

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: competitive-radar-monitoring
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Upstream extraction is retained for compatibility only. V1 default is
      # the no-key path; setting this to `mock` makes that explicit.
      COMPETE_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra dbt --extra api --extra report

      - name: Check dynamic sources requirement
        id: check-dynamic
        run: |
          uv run python -c "
          import os
          from pipeline.config import count_dynamic_sources, requires_browser
          count = count_dynamic_sources()
          req = str(requires_browser()).lower()
          print(f'Dynamic sources count: {count}')
          print(f'Requires browser: {req}')
          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a', encoding='utf-8') as f:
                  f.write(f'dynamic_count={count}\nrequires_browser={req}\n')
          "

      - name: Install Playwright Chromium (dynamic sources only)
        if: steps.check-dynamic.outputs.requires_browser == 'true'
        run: uv run playwright install --with-deps chromium

      # The DuckDB warehouse is the raw evidence + change authority. Persist it
      # between weekly runs so a change is not re-detected as "new" each week.
      - name: Restore warehouse cache
        uses: actions/cache@v4
        with:
          path: |
            data/compete.duckdb
            data/raw
          key: radar-warehouse-${{ github.run_id }}
          restore-keys: |
            radar-warehouse-

      - name: Collect + deterministic diff (no AI)
        run: uv run radar collect

      - name: Generate/update Antigravity pending queue (no AI)
        run: uv run radar prepare

      - name: Validate intelligence + dbt build + static JSON (no AI)
        run: uv run radar build --no-web

      - name: Commit refreshed authoritative outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intelligence/pending data/intelligence/weekly web/public/radar-static
          if [ -d "web/public/evidence" ]; then
            git add web/public/evidence
          fi
          if git diff --cached --quiet; then
            echo "No authoritative data changes to commit."
          else
            git commit -m "chore(radar): refresh pending queue and static snapshot [skip ci]"
            git push
          fi

      - name: Upload raw evidence + warehouse
        uses: actions/upload-artifact@v4
        with:
          name: competitive-radar-warehouse
          path: |
            data/compete.duckdb
            data/raw/**
            data/intelligence/pending/**
          retention-days: 14
