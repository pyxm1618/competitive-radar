name: competitive-radar quality gates

# Upstream CONTRIBUTING quality gates, plus the V1 authority checks.
# No model API key is required for any job.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPETE_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra dbt --extra api --extra report
      - name: Ruff lint
        run: uv run ruff check pipeline tests api scripts
      - name: Black check
        run: uv run black --check pipeline tests api scripts
      - name: Mypy
        run: uv run mypy pipeline
      - name: Pytest
        run: uv run pytest
      - name: Initialize warehouse for dbt
        run: uv run radar collect
      - name: dbt build (staging -> marts -> data tests)
        working-directory: warehouse/dbt
        env:
          COMPETE_DUCKDB_PATH: ${{ github.workspace }}/data/compete.duckdb
        run: uv run --project ${{ github.workspace }} dbt build --profiles-dir .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
